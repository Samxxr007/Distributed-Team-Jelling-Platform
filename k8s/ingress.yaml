apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jelling-ingress
  namespace: jelling
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
  - host: jelling.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
