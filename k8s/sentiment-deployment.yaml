apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentiment-service
  namespace: jelling
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentiment
  template:
    metadata:
      labels:
        app: sentiment
    spec:
      containers:
      - name: sentiment-service
        image: ghcr.io/your-org/jelling-sentiment:latest
        ports:
        - containerPort: 8001
        volumeMounts:
        - name: model-cache
          mountPath: /root/.cache/huggingface
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 60
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 45
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 1000m
            memory: 2Gi
      volumes:
      - name: model-cache
        emptyDir: {}
